name: Profile stats cards

# Self-hosted stats cards: avoids the rate-limited public github-readme-stats URLs.
on:
  schedule:
    - cron: "30 0 * * *"       # daily at 00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/stats.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render stats, languages and streak cards
        run: python scripts/stats.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the stats branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats
          build_dir: dist
          commit_message: "chore: update stats cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
