<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" role="img" aria-label="CNC Simulator">
<title>CNC Simulator</title>
<defs>
  <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6366F1" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0.07"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <clipPath id="r"><rect width="440" height="210" rx="16"/></clipPath>
</defs>
<g clip-path="url(#r)">
  <rect width="440" height="210" fill="#161B22"/>
  <rect width="440" height="210" fill="url(#tint)"/>
  <rect width="440" height="3" fill="url(#edge)"/>
</g>
<rect x=".5" y=".5" width="439" height="209" rx="15.5" fill="none" stroke="#30363D"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <text x="24" y="38" font-size="11" font-weight="600" letter-spacing="1.4" fill="#818CF8">INDUSTRIAL TOOLING  /  YANTRA24X7</text>
  <rect x="355.8" y="24" width="60.2" height="22" rx="11" fill="none" stroke="#30363D"/>
  <text x="385.9" y="39" text-anchor="middle" font-size="11" fill="#8B949E">Private</text>
  <text x="24" y="70" font-size="22" font-weight="700" fill="#E6EDF3">CNC Simulator</text>
  <text x="24" y="98" font-size="13.5" fill="#8B949E"><tspan x="24" dy="0">Interactive 3D preview of machining toolpaths that</tspan><tspan x="24" dy="20">catches programming errors before metal is cut.</tspan></text>
  <text x="416" y="181" text-anchor="end" font-size="12.5" font-weight="600" fill="url(#edge)">Private repo</text>
</g>
<rect x="24" y="162" width="172" height="26" rx="13" fill="none" stroke="#30363D" stroke-dasharray="4 4"/><text x="110" y="179.5" text-anchor="middle" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#8B949E">TODO: tech icons</text>
</svg>
