<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" role="img" aria-label="GitHub Stats">
<title>GitHub Stats</title>
<defs>
  <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6366F1" stop-opacity="0.08"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0.04"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
  <clipPath id="r"><rect width="440" height="210" rx="16"/></clipPath>
</defs>
<g clip-path="url(#r)"><rect width="440" height="210" fill="#F6F8FA"/><rect width="440" height="210" fill="url(#tint)"/><rect width="440" height="3" fill="url(#edge)"/></g>
<rect x=".5" y=".5" width="439" height="209" rx="15.5" fill="none" stroke="#D0D7DE"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="24" y="40" font-size="16" font-weight="700" fill="#1F2328">GitHub Stats</text>
<text x="24" y="76" font-size="13" fill="#57606A">Total stars</text><text x="416" y="76" font-size="13" font-weight="700" text-anchor="end" fill="#1F2328">21</text><text x="24" y="98" font-size="13" fill="#57606A">Contributions (last year)</text><text x="416" y="98" font-size="13" font-weight="700" text-anchor="end" fill="#1F2328">130</text><text x="24" y="120" font-size="13" fill="#57606A">Commits (last year)</text><text x="416" y="120" font-size="13" font-weight="700" text-anchor="end" fill="#1F2328">115</text><text x="24" y="142" font-size="13" fill="#57606A">Pull requests</text><text x="416" y="142" font-size="13" font-weight="700" text-anchor="end" fill="#1F2328">0</text><text x="24" y="164" font-size="13" fill="#57606A">Issues</text><text x="416" y="164" font-size="13" font-weight="700" text-anchor="end" fill="#1F2328">1</text><text x="24" y="186" font-size="13" fill="#57606A">Public repos</text><text x="416" y="186" font-size="13" font-weight="700" text-anchor="end" fill="#1F2328">28</text>
</g>
</svg>
